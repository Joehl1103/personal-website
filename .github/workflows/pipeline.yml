name: Deployement pipeline

on:
  push:
    branches:
      - master
    pull_request:
      branches: [master]
      types: [opened, synchronize]

jobs:
  prep_fe_for_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: check style
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm run test:e2e
