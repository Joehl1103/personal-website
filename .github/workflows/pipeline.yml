name: Deployement pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  prep_fe_for_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - name: check style
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm run test:e2e
        working-directory: frontend

  deploy_fe:
    needs: prep_fe_for_deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    concurrency:
      group: production_deployment
      cancel-in-progress: false

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkou@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production files
        run: |
          npm run build
          # test that the index file exists
          test -s dist/index.html
      - name: configure ssh
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host production
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Preserve current build
        run: |
          ssh production 'bash -se' <<'EOF'
          test -w /var/www/personal-website
          mkdir -p ~/website-backups
          backup=$(mktemp -d ~/website-backups/build-XXXXXXXX)
          cp -a /var/www/personal-website/. "$backup/"
          echo "Previous build saved to $backup"
          EOF

      - name: Upload production files
        run: |
          rsync -rlpvz --delete \
          --chmod=D755,F644 \
          dist/ production:/var/www/personal-website/

      - name: Remove deploy credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
