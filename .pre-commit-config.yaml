repos:
  - repo: local
    hooks:
      - id: actionlint
        name: Check GitHub Actions workflows
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: frontend-check
        name: frontend lint and tests
        entry: bash -c 'cd frontend && npm run lint && npm run test && npm run test:e2e:dev && npm run test:e2e && npm run build'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

